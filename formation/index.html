<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Ta formation · VyraShop</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#09090d"/>
<link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png"/>
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"/>
<link rel="stylesheet" href="/assets/fonts/fonts.css"/>
<link rel="stylesheet" href="/assets/formation/app.css"/>
</head>
<body>
<nav>
  <div class="col">
    <a href="/" aria-label="Accueil VyraShop"><img src="/assets/brand/logo-icone-144.png" alt="VyraShop" width="34" height="34"/></a>
    <span class="sp"></span>
    <a href="/formation/" class="on">Parcours</a>
    <a href="/formation/outils.html">Outils</a>
    <a href="/espace-membre/">Mon espace</a>
  </div>
</nav>

<main class="col" id="app">
  <p class="loading">Chargement de ta formation…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/formation/app.js"></script>
<script>
(async function () {
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);

  // Arrivée directe après paiement Stripe (?session_id=…) : on confirme l'achat et on invite à créer le compte.
  async function verifierPaiement() {
    var sid = params.get('session_id');
    if (!sid) return false;
    try {
      var r = await fetch('/.netlify/functions/verify-access?session_id=' + encodeURIComponent(sid));
      var d = await r.json();
      if (!d.valid) return false;
      app.innerHTML = '<div class="gate"><h1>Paiement confirmé.<span>Bienvenue !</span></h1>' +
        "<p>Dernière étape : crée ton compte avec <strong>le même e-mail que lors de l'achat</strong>. Ta formation s'ouvrira automatiquement.</p>" +
        '<div class="acts"><a class="btn btn-rose" href="/espace-membre/login.html">Créer mon compte</a></div></div>';
      return true;
    } catch (e) { return false; }
  }

  var cat;
  try {
    cat = await VS.api('catalogue');
    await VS.chargerProgression();
  } catch (e) {
    if (await verifierPaiement()) return;
    VS.afficherAcces(app, e.code);
    return;
  }

  // Ordre complet du parcours : leçons et quiz de fin de module
  var parcours = [];
  cat.modules.forEach(function (m) {
    m.lecons.forEach(function (l) { parcours.push({ id: l.id, titre: l.titre, l: l, m: m }); });
    if (m.quiz) parcours.push({ id: 'quiz-' + m.id, quiz: true, m: m, dernier: m.lecons[m.lecons.length - 1] });
  });
  var lecons = parcours.filter(function (p) { return !p.quiz; });
  var nbFaites = lecons.filter(function (p) { return VS.estFait(p.id); }).length;
  var pct = Math.round(nbFaites / lecons.length * 100);
  var prochaine = parcours.find(function (p) { return !VS.estFait(p.id); });

  function lien(p) { return p.quiz ? '/formation/lecon.html?id=' + p.dernier.id + '#quiz' : '/formation/lecon.html?id=' + p.id; }

  var h = '';
  h += '<header class="page-head"><span class="kicker">Formation TikTok Expert</span>';
  h += '<h1>Ton <span>parcours</span></h1>';
  h += '<p class="sub">' + lecons.length + ' leçons de 3 à 5 minutes, une action à chaque fois. Compte environ 90 jours à ton rythme.</p>';
  h += '<div class="prog"><div class="prog-bar"><b style="width:' + pct + '%"></b></div><div class="prog-txt"><span>' + nbFaites + ' / ' + lecons.length + ' leçons faites</span><span>' + pct + ' %</span></div></div>';

  if (prochaine) {
    var jour = prochaine.quiz ? prochaine.dernier.jour : prochaine.l.jour;
    h += '<section class="today"><span class="k">' + (nbFaites === 0 ? 'Commence ici · Jour 1' : 'Aujourd\'hui · Jour ' + jour) + '</span>';
    if (prochaine.quiz) {
      h += '<h2>Quiz : ' + VS.esc(prochaine.m.titre) + '</h2><p class="act">3 questions pour valider le module.</p>';
    } else {
      h += '<h2>' + VS.esc(prochaine.l.titre) + '</h2><p class="act"><b>Ton action :</b> ' + VS.esc(prochaine.l.action) + '</p>';
    }
    h += '<a class="btn btn-rose btn-full" href="' + lien(prochaine) + '">' + (prochaine.quiz ? 'Faire le quiz' : 'Lire la leçon (' + prochaine.l.duree + ' min)') + '</a></section>';
  } else {
    h += '<section class="today"><span class="k">Bravo</span><h2>Parcours terminé</h2><p class="act">Tu as fait toutes les leçons. Garde ta routine du dimanche et reviens piocher dans les outils.</p></section>';
  }
  h += '</header>';

  cat.modules.forEach(function (m) {
    var faites = m.lecons.filter(function (l) { return VS.estFait(l.id); }).length;
    h += '<section class="mod" id="' + m.id + '"><div class="mod-head"><h2>' + VS.esc(m.titre) + '</h2><span class="cnt">' + faites + ' / ' + m.lecons.length + '</span></div>';
    h += '<p class="sous">' + VS.esc(m.sous) + '</p><ul class="lessons">';
    parcours.filter(function (p) { return p.m.id === m.id; }).forEach(function (p) {
      var cls = VS.estFait(p.id) ? 'done' : (prochaine && p.id === prochaine.id ? 'next' : '');
      var titre = p.quiz ? 'Quiz du module' : p.l.titre;
      var meta = p.quiz ? '3 questions' : 'Jour ' + p.l.jour + ' · ' + p.l.duree + ' min';
      h += '<li><a class="' + cls + (p.quiz ? ' quizrow' : '') + '" href="' + lien(p) + '"><span class="tick" aria-hidden="true"></span><span class="lt">' + VS.esc(titre) + '</span><span class="lm">' + meta + '</span></a></li>';
    });
    h += '</ul></section>';
  });

  h += '<section class="mod"><h2>Tes outils</h2><div class="cards">';
  h += '<a class="card" href="/formation/outils.html#hooks"><span><b>100 hooks</b><small>Classés par niche, prêts à copier</small></span><span class="kicker">Ouvrir</span></a>';
  h += '<a class="card" href="/formation/outils.html#scripts"><span><b>20 scripts</b><small>Vidéos produits, étape par étape</small></span><span class="kicker">Ouvrir</span></a>';
  h += '<a class="card" href="/formation/outils.html#modeles"><span><b>7 modèles</b><small>Calendrier, message aux marques, suivi des ventes</small></span><span class="kicker">Ouvrir</span></a>';
  h += '</div></section>';

  h += '<section class="mod"><h2>Les 15 ebooks en PDF</h2><p class="sous">Le contenu des leçons, regroupé en 15 ebooks à télécharger si tu préfères lire hors ligne.</p><ul class="pdfs">';
  var noms = ['Les bases de la monétisation', 'Le Creator Rewards Program', 'Lives et cadeaux', 'Partenariats de marques', 'Revenus durables et automatisation',
    'Débuter sur TikTok Shop', 'Choisir ses produits', 'Vidéos produits qui vendent', 'Vendre plus', 'Ton système TikTok Shop',
    "L'algorithme", 'Les hooks', 'Le montage', 'La publication', 'Grandir jusqu\'à 10 000 abonnés'];
  noms.forEach(function (n, i) { h += '<li><span>Ebook ' + (i + 1) + ' · ' + VS.esc(n) + '</span><button class="btn btn-line btn-sm" type="button" data-ebook="ebook' + (i + 1) + '">PDF</button></li>'; });
  h += '</ul></section><div style="height:60px"></div>';

  app.innerHTML = h;

  // Téléchargement des PDF via la fonction protégée existante
  app.querySelectorAll('[data-ebook]').forEach(function (b) {
    b.addEventListener('click', async function () {
      var avant = b.textContent; b.textContent = '…'; b.disabled = true;
      try {
        var t = await VS.token();
        if (!t) throw new Error();
        var r = await fetch('/.netlify/functions/get-formation-pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ access_token: t, ebook: b.dataset.ebook }) });
        if (!r.ok) throw new Error();
        var blob = await r.blob(); var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = 'VyraShop-' + b.dataset.ebook + '.pdf'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      } catch (e) { VS.toast('Téléchargement impossible, réessaie'); }
      b.textContent = avant; b.disabled = false;
    });
  });
})();
</script>
</body>
</html>
